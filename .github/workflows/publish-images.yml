name: Publish Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for public frontend build inputs
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: publish-${{ inputs.environment }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image_variable: API
            dockerfile: apps/api/Dockerfile
            target: runtime
          - name: migrator
            image_variable: MIGRATOR
            dockerfile: apps/api/Dockerfile
            target: migrator
          - name: web
            image_variable: WEB
            dockerfile: apps/web/Dockerfile
            target: runtime
          - name: dashboard
            image_variable: DASHBOARD
            dockerfile: apps/dashboard/Dockerfile
            target: runtime
          - name: admin
            image_variable: ADMIN
            dockerfile: apps/admin/Dockerfile
            target: runtime
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/app-${{ matrix.name }}
      TAG: ${{ inputs.environment }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.name == 'web'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL }}
        run: |
          test -n "$VITE_API_URL"
          test -n "$VITE_DASHBOARD_URL"
      - if: matrix.name == 'dashboard' || matrix.name == 'admin'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: test -n "$VITE_API_URL"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_DASHBOARD_URL=${{ vars.VITE_DASHBOARD_URL }}
      - run: |
          printf '%s_IMAGE=%s@%s\n' "${{ matrix.image_variable }}" "$IMAGE" "${{ steps.build.outputs.digest }}" > image-digest.env
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.environment }}-${{ github.sha }}-${{ matrix.name }}-publication
          path: |
            image-digest.env
            trivy.sarif
          retention-days: 90
