name: app

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to an immutable image reference}
    env_file:
      - ${API_RUNTIME_ENV_FILE:?Set API_RUNTIME_ENV_FILE to the API runtime environment file}
    environment:
      NODE_ENV: production
      PORT: 3000
    init: true
    restart: unless-stopped
    networks:
      - application

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable image reference}
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVER_API_URL: http://api:3000
    init: true
    restart: unless-stopped
    networks:
      - application

  dashboard:
    image: ${DASHBOARD_IMAGE:?Set DASHBOARD_IMAGE to an immutable image reference}
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVER_API_URL: http://api:3000
    init: true
    restart: unless-stopped
    networks:
      - application

  admin:
    image: ${ADMIN_IMAGE:?Set ADMIN_IMAGE to an immutable image reference}
    depends_on:
      api:
        condition: service_healthy
    environment:
      SERVER_API_URL: http://api:3000
    init: true
    restart: unless-stopped
    networks:
      - application

  migrator:
    image: ${MIGRATOR_IMAGE:?Set MIGRATOR_IMAGE to an immutable image reference}
    env_file:
      - ${MIGRATOR_RUNTIME_ENV_FILE:?Set MIGRATOR_RUNTIME_ENV_FILE to the migration environment file}
    profiles: ['tools']
    networks:
      - application

  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to an immutable image reference}
    depends_on:
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?Set ADMIN_HOST}
      API_HOST: ${API_HOST:?Set API_HOST}
      DASHBOARD_HOST: ${DASHBOARD_HOST:?Set DASHBOARD_HOST}
      WEB_HOST: ${WEB_HOST:?Set WEB_HOST}
    ports:
      - '80:80'
      - '443:443'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - application
      - public

networks:
  application:
    internal: true
  public:

volumes:
  caddy-config:
  caddy-data:
